<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicons. The ?v=2 is a cache buster: browsers cache favicons in their
         own sticky store keyed by URL, so bump the version when the logo changes. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme color for browser UI -->
    <meta name="theme-color" content="#0f172a" />

    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <meta name="title" content="wallacast" />
    <meta name="description" content="Listen to your articles and podcasts with text-to-speech" />

    <!-- Social link previews (Open Graph + Twitter). og:image is root-relative, which most
         chat apps resolve against the page URL. If a platform (Facebook is the strict one)
         refuses to show the image, replace it with the absolute URL of your instance. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="wallacast" />
    <meta property="og:description" content="Listen to your articles and podcasts with text-to-speech" />
    <meta property="og:image" content="/icon-512.png?v=2" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="wallacast" />
    <meta name="twitter:description" content="Listen to your articles and podcasts with text-to-speech" />
    <meta name="twitter:image" content="/icon-512.png?v=2" />

    <!-- iOS Specific Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="wallacast" />
    <link rel="apple-touch-icon" href="/icon-192.png?v=2" />

    <title>wallacast</title>
    <!-- Apply saved theme before first paint to prevent flash -->
    <script>
      try {
        var t = localStorage.getItem('wallacast-theme');
        if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
      } catch(e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
